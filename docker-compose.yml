services:
  gridfarm:
    build: .
    image: gridfarm:0.1.0
    container_name: gridfarm
    restart: unless-stopped
    ports:
      - '${PORT:-8080}:8080'
    env_file:
      - .env
    # Repassadas do shell só quando o shell as define — sem isso, o
    # `MOCK_PRINTERS=true docker compose up` do README não chegava ao processo:
    # a variável ficava no compose e o container seguia lendo o .env. Ausentes
    # no shell, o Compose as omite e o env_file continua mandando.
    environment:
      - MOCK_PRINTERS
      - DETECCAO_ENABLED
      - DETECCAO_SIMULAR_CONF
      - DETECCAO_INTERVALO_S
      - DETECCAO_ESPERA_INICIAL_S
    # The process does not run as root. These must own ./data — keep the
    # defaults if your user is uid 1000, otherwise set them in .env
    # using `id -u` / `id -g`.
    user: '${PUID:-1000}:${PGID:-1000}'
    volumes:
      # database, backups, alert frames and thumbnails
      - ./data:/data
    # the farm lives on the LAN: without host networking the container cannot
    # reach .local hosts, because mDNS multicast does not cross the bridge
    network_mode: ${NETWORK_MODE:-bridge}
